name: update-data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-data
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python fetch_data.py
      - name: Commit data
        run: |
          git config user.name "surf-bot"
          git config user.email "surf-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
